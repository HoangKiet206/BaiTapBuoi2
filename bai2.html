<!DOCTYPE html>
<html>

<head>
    <title>Bài tập 2</title>
    <style>
        #form-dang-ky {
            width: 400px;
            border: 1px solid gray;
            padding: 20px;
            background-color: whitesmoke;
        }

        h2 {
            color: blue;
            text-align: center;
        }

        label {
            font-size: 16px;
        }

        input {
            padding: 5px;
        }

        .nut-dang-ky {
            background-color: blue;
            color: white;
            padding: 10px;
            font-size: 16px;
        }
    </style>
</head>

<body>
    <h2>Đăng ký khóa học</h2>
    <form id="form-dang-ky">
        <p>
            <label for="ho-ten">Họ và tên:</label>
            <input type="text" id="ho-ten" />
        </p>
        <p>
            <label>Giới tính:</label>
            <input type="radio" name="gioi-tinh"> Nam
            <input type="radio" name="gioi-tinh"> Nữ
        </p>
        <p>
            <label for="email">Email:</label>
            <input type="email" id="email" />
        </p>
        <p>
            <label for="mat-khau">Mật khẩu:</label>
            <input type="password" id="mat-khau" />
        </p>
        <p>
            <label for="khoa-hoc">Khóa học:</label>
            <select id="khoa-hoc" name="khoa-hoc">
                <option value="html-css">HTML/CSS</option>
                <option value="javascript">JavaScript</option>
                <option value="reactjs">ReactJS</option>
            </select>
        </p>
        <p>
            <label for="ghi-chu">Ghi chú:</label>
            <textarea id="ghi-chu"></textarea>
        </p>
        <p>
            <label>
                <input type="checkbox" />Tôi đồng ý với điều khoản
            </label>
        </p>
        <button type="submit" class="nut-dang-ky">Đăng ký</button>
    </form>
</body>

</html>
